allow = ["explore", "research", "Edit", "Bash=cd /d/game_develop/rymthic_game && npm run build 2>&1 | tail -15", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport sys; sys.path.insert(0, 'tools')\nfrom balance_sim import hero, taken\nfor acc in (0.80, 0.85, 0.90, 0.95):\n    hp = hero(20)[0]\n    left = (hp - taken(20, acc)) / hp * 100\n    print(f'acc {acc:.2f} -> level 20 HP left {left:.0f}%')\n\"", "Bash=cd /d/game_develop/rymthic_game && node -e \"\nconst fs = require('fs'); const zlib = require('zlib');\nconst buf = fs.readFileSync('public/assets/ui/button.png');\nlet pos = 8; const rc = () => { const len = buf.readUInt32BE(pos); const type = buf.toString('ascii', pos+4, pos+8); const data = buf.subarray(pos+8, pos+8+len); pos += 12+len; return { type, data }; };\nlet w, h, ct; const idat = []; let c = rc(); w = c.data.readUInt32BE(0); h = c.data.readUInt32BE(4); ct = c.data[9];\nconsole.log('button.png:', w + 'x' + h, 'colorType', ct);\nconst ch = ct === 6 ? 4 : 3;\nwhile (true) { c = rc(); if (c.type === 'IDAT') idat.push(c.data); else if (c.type === 'IEND') break; }\nconst raw = zlib.inflateSync(Buffer.concat(idat)); const st = w * ch;\nconst paeth = (a,b,cc) => { const p=a+b-cc, pa=Math.abs(p-a), pb=Math.abs(p-b), pc=Math.abs(p-cc); return pa<=pb&&pa<=pc?a:pb<=pc?b:cc; };\nconst out = Buffer.alloc(h * st); let prev = Buffer.alloc(st);\nfor (let y = 0; y < h; y++) { const f = raw[y*(st+1)]; const row = raw.subarray(y*(st+1)+1,(y+1)*(st+1)); const cur = out.subarray(y*st,(y+1)*st);\n  for (let x = 0; x < st; x++) { const a = x>=ch?cur[x-ch]:0, b=prev[x], cc=x>=ch?prev[x-ch]:0; let v=row[x];\n    if (f===1) v=(v+a)&0xff; else if (f===2) v=(v+b)&0xff; else if (f===3) v=(v+((a+b)>>1))&0xff; else if (f===4) v=(v+paeth(a,b,cc))&0xff; cur[x]=v; }\n  prev = cur; }\n// 16x16 block map: opaque areas + average brightness\nconst B = 16, bw = Math.ceil(w/B), bh = Math.ceil(h/B);\nlet map = ''; const brights = [];\nfor (let by = 0; by < bh; by++) { let row = '';\n  for (let bx = 0; bx < bw; bx++) {\n    let sum = 0, n = 0, op = 0;\n    for (let y = by*B; y < Math.min((by+1)*B, h); y++) for (let x = bx*B; x < Math.min((bx+1)*B, w); x++) {\n      const i = (y*w+x)*ch; const a = ch===4 ? out[i+3] : 255;\n      if (a > 128) { op++; sum += (out[i]+out[i+1]+out[i+2])/3; n++; }\n    }\n    if (n === 0) row += '.';\n    else { brights.push(sum/n); row += sum/n > 150 ? 'W' : sum/n > 70 ? 'M' : 'D'; }\n  }\n  map += row + '\\n';\n}\nconsole.log(map);\nconsole.log('opaque blocks:', brights.length, 'avg brightness:', Math.round(brights.reduce((a,b)=>a+b,0)/brights.length));\n\"", "Bash=cd /d/game_develop/rymthic_game && mkdir -p /tmp/kenney && curl -sL -o /tmp/kenney/ui-pack.zip \"https://opengameart.org/sites/default/files/kenney_ui-pack.zip\" --max-time 60 && ls -la /tmp/kenney/ && file /tmp/kenney/ui-pack.zip 2>/dev/null || node -e \"const b=require('fs').readFileSync('/tmp/kenney/ui-pack.zip'); console.log('bytes:', b.length, 'PK magic:', b.slice(0,2).toString()==='PK')\"", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport zipfile\nz = zipfile.ZipFile('/tmp/kenney/ui-pack.zip')\nnames = z.namelist()\nprint('total files:', len(names))\n# 找按钮相关\nimport re\nbtns = [n for n in names if 'button' in n.lower()]\nprint('button files:', len(btns))\nfor n in btns[:30]: print(' ', n)\n\" 2>&1 | head -40", "Bash=cd /d/game_develop/rymthic_game && mkdir -p tools/_kenney && cp /tmp/kenney/ui-pack.zip tools/_kenney/ && python -c \"\nimport zipfile, os\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('ui-pack.zip')\nnames = z.namelist()\nprint('total:', len(names))\nbtns = [n for n in names if 'button' in n.lower() and n.lower().endswith('.png')]\nprint('button pngs:', len(btns))\nfor n in btns[:40]: print(' ', n)\n\"", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport zipfile, os, struct\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('ui-pack.zip')\n# Dark 系 rectangle 按钮\ncands = [n for n in z.namelist() if '/Dark/' in n and 'button_rectangle' in n and 'Default/' in n and n.endswith('.png')]\nfor n in cands:\n    data = z.read(n)\n    w, h = struct.unpack('>II', data[16:24])\n    print(f'{w}x{h}  {n}')\n\" 2>&1 | head -20", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport zipfile, os, struct\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('ui-pack.zip')\nnames = z.namelist()\ndarks = [n for n in names if '/Dark/' in n and 'button' in n.lower() and n.endswith('.png')]\nprint('Dark buttons:', len(darks))\nfor n in darks[:15]:\n    data = z.read(n)\n    w, h = struct.unpack('>II', data[16:24])\n    print(f'{w}x{h}  {n.split(chr(47))[-1]}')\n\"", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport zipfile, os\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('ui-pack.zip')\nnames = z.namelist()\ndirs = set()\nfor n in names:\n    parts = n.split('/')\n    if len(parts) >= 2 and 'PNG' in parts:\n        dirs.add(parts[1] if len(parts) > 1 else '?')\nprint('color dirs:', sorted(dirs))\n# 统计每个颜色目录下 button_rectangle_flat 类\nfor d in sorted(dirs):\n    cnt = sum(1 for n in names if f'/{d}/' in n and 'button' in n.lower() and n.endswith('.png'))\n    if cnt: print(f'  {d}: {cnt} buttons')\n\"", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport zipfile, os, struct, zlib\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('ui-pack.zip')\nnames = [n for n in z.namelist() if '/Grey/' in n and 'button' in n.lower() and n.endswith('.png')]\n# 解压一个 flat 矩形按钮，分析亮度 + 圆角\nimport io\ndef png_info(data):\n    w, h = struct.unpack('>II', data[16:24])\n    return w, h\n# 列出所有 grey 按钮尺寸\nfor n in sorted(names):\n    w, h = png_info(z.read(n))\n    print(f'{w}x{h}  {n.split(chr(47))[-1]}')\n\" 2>&1 | head -30", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport zipfile, os, struct, zlib\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('ui-pack.zip')\n\ndef decode(data):\n    w, h = struct.unpack('>II', data[16:24])\n    ct = data[25]\n    ch = 4 if ct == 6 else 3\n    pos = 8; idat = b''\n    while True:\n        ln = struct.unpack('>I', data[pos:pos+4])[0]\n        typ = data[pos+4:pos+8]\n        if typ == b'IDAT': idat += data[pos+8:pos+8+ln]\n        elif typ == b'IEND': break\n        pos += 12 + ln\n    raw = zlib.decompress(idat)\n    st = w * ch\n    out = bytearray(h * st); prev = bytearray(st)\n    def paeth(a,b,c):\n        p = a+b-c; pa=abs(p-a); pb=abs(p-b); pc=abs(p-c)\n        return a if pa<=pb and pa<=pc else (b if pb<=pc else c)\n    for y in range(h):\n        f = raw[y*(st+1)]\n        row = raw[y*(st+1)+1:(y+1)*(st+1)]\n        for x in range(st):\n            a = out[y*st+x-ch] if x >= ch else 0\n            b = prev[x]\n            cc = prev[x-ch] if x >= ch else 0\n            v = row[x]\n            if f==1: v=(v+a)&0xff\n            elif f==2: v=(v+b)&0xff\n            elif f==3: v=(v+((a+b)>>1))&0xff\n            elif f==4: v=(v+paeth(a,b,cc))&0xff\n            out[y*st+x] = v\n        prev = out[y*st:(y+1)*st]\n    return w, h, ch, bytes(out)\n\nfor name in ['button_rectangle_flat.png','button_rectangle_depth_flat.png','button_rectangle_border.png','button_rectangle_depth_gradient.png']:\n    w, h, ch, px = decode(z.read('PNG/Grey/Default/' + name))\n    # 平均亮度（不透明像素）+ 圆角半径（左上角从透明到不透明的最大距离）\n    total=0; n=0; minx=w; miny=h\n    for y in range(h):\n        for x in range(w):\n            a = px[(y*w+x)*ch+3]\n            if a > 128:\n                total += (px[(y*w+x)*ch]+px[(y*w+x)*ch+1]+px[(y*w+x)*ch+2])/3\n                n += 1\n                if x < minx: minx=x\n                if y < miny: miny=y\n    # 左上圆角：扫描 y=miny 行找第一个不透明 x（圆角起点）\n    corner = 0\n    for y in range(h):\n        run = 0\n        for x in range(w):\n            if px[(y*w+x)*ch+3] > 128: run += 1\n            else:\n                if run > corner: corner = run\n                run = 0\n    print(f'{name}: avg brightness {total/n:.0f}, opaque {n}, corner run max {corner}')\n\"", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport zipfile, os\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('ui-pack.zip')\nfor name in ['button_rectangle_flat.png','button_rectangle_depth_flat.png','button_rectangle_border.png','button_rectangle_depth_gradient.png','button_rectangle_gloss.png']:\n    data = z.read('PNG/Grey/Default/' + name)\n    open('tools/_kenney/' + name, 'wb').write(data)\nprint('extracted 5 candidates')\n\" && node -e \"\nconst fs = require('fs'); const zlib = require('zlib');\nfunction analyze(file) {\n  const buf = fs.readFileSync('tools/_kenney/' + file);\n  let pos = 8; const rc = () => { const len = buf.readUInt32BE(pos); const type = buf.toString('ascii', pos+4, pos+8); const data = buf.subarray(pos+8, pos+8+len); pos += 12+len; return { type, data }; };\n  let w, h, ct; const idat = []; let c = rc(); w = c.data.readUInt32BE(0); h = c.data.readUInt32BE(4); ct = c.data[9];\n  const ch = ct === 6 ? 4 : 3;\n  while (true) { c = rc(); if (c.type === 'IDAT') idat.push(c.data); else if (c.type === 'IEND') break; }\n  const raw = zlib.inflateSync(Buffer.concat(idat)); const st = w * ch;\n  const paeth = (a,b,cc) => { const p=a+b-cc, pa=Math.abs(p-a), pb=Math.abs(p-b), pc=Math.abs(p-cc); return pa<=pb&&pa<=pc?a:pb<=pc?b:cc; };\n  const out = Buffer.alloc(h * st); let prev = Buffer.alloc(st);\n  for (let y = 0; y < h; y++) { const f = raw[y*(st+1)]; const row = raw.subarray(y*(st+1)+1,(y+1)*(st+1)); const cur = out.subarray(y*st,(y+1)*st);\n    for (let x = 0; x < st; x++) { const a = x>=ch?cur[x-ch]:0, b=prev[x], cc=x>=ch?prev[x-ch]:0; let v=row[x];\n      if (f===1) v=(v+a)&0xff; else if (f===2) v=(v+b)&0xff; else if (f===3) v=(v+((a+b)>>1))&0xff; else if (f===4) v=(v+paeth(a,b,cc))&0xff; cur[x]=v; }\n    prev = cur; }\n  let total=0, n=0;\n  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {\n    const i=(y*w+x)*ch; if (out[i+3] > 128) { total += (out[i]+out[i+1]+out[i+2])/3; n++; }\n  }\n  // 圆角：统计每行不透明 run 长度分布（从角到边）\n  let maxRun = 0;\n  for (let y = 0; y < h; y++) { let run = 0; for (let x = 0; x < w; x++) { if (out[(y*w+x)*ch+3] > 128) run++; else { if (run > maxRun) maxRun = run; run = 0; } } }\n  console.log(file, '|', w+'x'+h, '| avgBright', Math.round(total/n), '| maxRowRun', maxRun);\n}\n['button_rectangle_flat.png','button_rectangle_depth_flat.png','button_rectangle_border.png','button_rectangle_depth_gradient.png','button_rectangle_gloss.png'].forEach(analyze);\n\"", "Bash=cd /d/game_develop/rymthic_game && python -c \"\nimport zipfile, os\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('ui-pack.zip')\nextras = [n for n in z.namelist() if '/Extra/' in n and n.endswith('.png')]\nfor n in extras: print(' ', n)\n\" && curl -sL -o tools/_kenney/rpg.zip \"https://kenney.nl/media/pages/assets/ui-pack-rpg-expansion/7ec4a46657-1677661824/kenney_ui-pack-rpg-expansion.zip\" --max-time 60 && python -c \"\nimport zipfile, os\nos.chdir('tools/_kenney')\nz = zipfile.ZipFile('rpg.zip')\nnames = z.namelist()\nprint('rpg total:', len(names))\nbtns = [n for n in names if 'button' in n.lower() and n.endswith('.png')]\nfor n in btns[:20]: print(' ', n)\n\""]
